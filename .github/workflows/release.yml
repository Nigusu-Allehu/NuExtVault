name: Release NuExtVault

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: Build, validate, and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate tag and package version
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          [xml] $project = Get-Content "src/NuExtVault.Cli/NuExtVault.Cli.csproj"
          $version = @($project.Project.PropertyGroup.Version)[0]
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "NuExtVault.Cli.csproj does not define Version."
          }

          if ("${{ github.event_name }}" -eq "push") {
            $expectedTag = "v$version"
            if ("${{ github.ref_name }}" -cne $expectedTag) {
              throw "Tag '${{ github.ref_name }}' must exactly match '$expectedTag'."
            }
          } elseif ($env:DISPATCH_VERSION -cne $version) {
            throw "Dispatch version '$env:DISPATCH_VERSION' must exactly match package version '$version'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore NuExtVault.slnx

      - name: Build with warnings as errors
        run: dotnet build NuExtVault.slnx --no-restore --configuration Release --warnaserror

      - name: Run full SDK test suite
        run: >-
          dotnet test tests/NuExtVault.Extensions.Sdk.Tests/NuExtVault.Extensions.Sdk.Tests.csproj
          --no-restore
          --no-build
          --configuration Release
          --logger "trx;LogFileName=sdk-tests.trx"
          --results-directory TestResults

      - name: Run full unit test suite
        run: >-
          dotnet test tests/NuExtVault.UnitTests/NuExtVault.UnitTests.csproj
          --no-restore
          --no-build
          --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Run full functional and documentation test suites
        run: >-
          dotnet test tests/NuExtVault.FunctionalTests/NuExtVault.FunctionalTests.csproj
          --no-restore
          --no-build
          --configuration Release
          --logger "trx;LogFileName=functional-tests.trx"
          --results-directory TestResults

      - name: Pack NuExtVault once
        run: >-
          dotnet pack src/NuExtVault.Cli/NuExtVault.Cli.csproj
          --no-restore
          --no-build
          --configuration Release
          -p:PackageVersion=${{ steps.version.outputs.version }}
          --output artifacts/package

      - name: Inspect exact package
        shell: pwsh
        run: |
          $expected = "artifacts/package/NuExtVault.${{ steps.version.outputs.version }}.nupkg"
          $packages = @(Get-ChildItem "artifacts/package" -Filter "*.nupkg")
          if ($packages.Count -ne 1 -or $packages[0].FullName -ne (Resolve-Path $expected).Path) {
            throw "Expected exactly '$expected'. Found: $($packages.Name -join ', ')"
          }
          $entries = [IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $names = @($entries.Entries.FullName)
            foreach ($required in @("LICENSE", "README.md", "tools/net10.0/any/DotnetToolSettings.xml")) {
              if ($required -notin $names) {
                throw "Package is missing '$required'."
              }
            }
            if ($names | Where-Object { $_ -match "(^|/)(tests|obj)/" -or $_ -like "*.cs" }) {
              throw "Package contains test, intermediate, or source artifacts."
            }
          } finally {
            $entries.Dispose()
          }

      - name: Smoke test exact package
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "nuextvault-release"
          $feed = Join-Path $root "feed"
          $tools = Join-Path $root "tools"
          $storage = Join-Path $root "storage"
          $config = Join-Path $root "NuGet.Config"
          New-Item -ItemType Directory -Force $feed | Out-Null
          $package = Resolve-Path "artifacts/package/NuExtVault.${{ steps.version.outputs.version }}.nupkg"
          Copy-Item $package $feed
          @"
          <configuration>
            <packageSources>
              <clear />
              <add key="ExactPackage" value="$feed" />
            </packageSources>
          </configuration>
          "@ | Set-Content $config
          dotnet tool install --tool-path $tools NuExtVault --configfile $config --version "${{ steps.version.outputs.version }}" --no-cache
          if ($LASTEXITCODE -ne 0) { throw "Tool installation failed." }

          $command = Join-Path $tools $(if ($IsWindows) { "nuextvault.exe" } else { "nuextvault" })
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([Net.IPEndPoint] $listener.LocalEndpoint).Port
          $listener.Stop()
          $server = Start-Process $command -ArgumentList @(
            "start", "--port", $port, "--storage", $storage
          ) -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..150) {
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:$port/health/ready"
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 100
              }
            }
            if (-not $ready) { throw "Installed tool did not become ready." }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id }
            $server | Wait-Process
          }

          dotnet tool uninstall --tool-path $tools NuExtVault
          if ($LASTEXITCODE -ne 0) { throw "Tool uninstall failed." }
          Remove-Item -Recurse -Force $root

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: NuExtVault-${{ steps.version.outputs.version }}
          path: artifacts/package/NuExtVault.${{ steps.version.outputs.version }}.nupkg
          if-no-files-found: error
          retention-days: 30

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish to NuGet.org
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: NuExtVault-${{ needs.build.outputs.version }}
          path: artifacts/package

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish exact package
        shell: pwsh
        env:
          NUGET_TEMPORARY_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $package = Resolve-Path "artifacts/package/NuExtVault.${{ needs.build.outputs.version }}.nupkg"
          dotnet nuget push $package --api-key $env:NUGET_TEMPORARY_API_KEY --source https://api.nuget.org/v3/index.json
