name: Documentation examples

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  examples:
    name: Documentation examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: documentation-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            documentation-nuget-${{ runner.os }}-

      - name: Restore functional tests
        run: dotnet restore tests/NuGet.TestServer.FunctionalTests/NuGet.TestServer.FunctionalTests.csproj

      - name: Build functional tests
        run: >-
          dotnet build tests/NuGet.TestServer.FunctionalTests/NuGet.TestServer.FunctionalTests.csproj
          --no-restore
          --configuration Release
          --warnaserror

      - name: Run documentation examples
        run: >-
          dotnet test tests/NuGet.TestServer.FunctionalTests/NuGet.TestServer.FunctionalTests.csproj
          --no-restore
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~NuGet.TestServer.FunctionalTests.DocumentationContractTests|FullyQualifiedName~NuGet.TestServer.FunctionalTests.DocumentationExampleTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFilePrefix=documentation-${{ matrix.os }}"
          --results-directory TestResults

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7
